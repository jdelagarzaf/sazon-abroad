<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sazón Abroad{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  {% set navigation = [('home', 'Inicio'), ('find', 'Búsqueda'), ('recipes_page', 'Recetas'), ('catalog_page', 'Catálogo'), ('evaluation_page', 'Evaluación')] %}
  <header class="border-b border-line bg-brand text-white">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-x-8 gap-y-3 px-5 py-4 sm:px-8">
      <a href="{{ url_for('home') }}" class="font-display text-2xl font-semibold">Sazón Abroad</a>
      <nav aria-label="Navegación principal" class="flex flex-wrap gap-1">
        {% for endpoint, label in navigation %}
          <a href="{{ url_for(endpoint) }}"
             {% if request.endpoint == endpoint %}aria-current="page"{% endif %}
             class="rounded-lg px-3 py-2 text-sm font-semibold hover:bg-white/15 aria-[current=page]:bg-white/20">{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-5 py-8 sm:px-8 sm:py-12">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
