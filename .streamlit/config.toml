[theme]
base = "light"
primaryColor = "#8B1F37"
backgroundColor = "#FCF4EE"
secondaryBackgroundColor = "#F4E8E2"
textColor = "#41272A"
borderColor = "#E7D4CD"
showWidgetBorder = true
font = "sans serif"
headingFont = "serif"
baseRadius = "1rem"
paddingTop = "2rem"

[theme.sidebar]
primaryColor = "#FFB6BC"
backgroundColor = "#5A1324"
secondaryBackgroundColor = "#7D283B"
textColor = "#FFF0EA"
borderColor = "#9A4F5D"
paddingTop = "1rem"

[browser]
gatherUsageStats = false
